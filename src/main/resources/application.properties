spring.application.name=inventario-backend

# configuracion mariadb
spring.datasource.url=jdbc:mariadb://localhost:3307/inventario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# configuracion jpa
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# configurar el patron del log
loggin.pattern.console=[%thread] %-5level: %logger - %msg%n
# configurar el nivel de log(INTO)
loggin.level.root=INFO
